version: '3.8'

services:
  # ----------------------------------------------------
  # 1. POSTGRES DATABASE
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: fray_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: abovethefray
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. REDIS PUB/SUB
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fray_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. NODE.JS WORKER 1
  # ----------------------------------------------------
  node_app_1:
    build: .
    container_name: fray_node_1
    restart: always
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: abovethefray
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # 4. NODE.JS WORKER 2
  # ----------------------------------------------------
  node_app_2:
    build: .
    container_name: fray_node_2
    restart: always
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: abovethefray
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # 5. NGINX LOAD BALANCER / REVERSE PROXY
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: fray_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node_app_1
      - node_app_2

volumes:
  pgdata: